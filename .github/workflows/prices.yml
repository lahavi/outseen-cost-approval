name: Publish daily AWS price files

# Reads AWS's public price lists (no AWS account or credentials) and publishes
# one small JSON file per region to GitHub Pages, where the plugin downloads them.

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Build price files
        run: node scripts/build-prices.ts --out site/prices/v1
      - name: Add an index page
        if: always()
        run: |
          echo '<!doctype html><title>AWS list prices for the AWS cost approval plugin</title><p>Daily AWS on-demand list prices by region, built from the public AWS price lists. See <a href="prices/v1/index.json">prices/v1/index.json</a>.</p>' > site/index.html
      - uses: actions/upload-pages-artifact@v3
        if: always() && hashFiles('site/prices/v1/index.json') != ''
        with:
          path: site
      - id: deploy
        if: always() && hashFiles('site/prices/v1/index.json') != ''
        uses: actions/deploy-pages@v4
